apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: diary-app
  labels:
    app: diary-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: diary-frontend
  template:
    metadata:
      labels:
        app: diary-frontend
    spec:
      containers:
        - name: diary-frontend
          image: sidhigoel/diary-frontend:latest
          ports:
            - containerPort: 80
